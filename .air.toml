#:schema https://json.schemastore.org/any.json

env_files = []
root = "."
testdata_dir = "testdata"
tmp_dir = "tmp"

[build]
  args_bin = []
  cmd = "make dev/build"
  delay = 200
  entrypoint = ["./tmp/blog"]
  exclude_dir = [".git", "bin", "node_modules", "public", "tmp"]
  exclude_file = []
  exclude_regex = ["_test.go$", "_templ.go$"]
  exclude_unchanged = false
  follow_symlink = false
  full_bin = ""
  ignore_dangerous_root_dir = false
  include_dir = []
  include_ext = ["go", "templ", "css", "md"]
  include_file = []
  kill_delay = "500ms"
  log = "build-errors.log"
  poll = false
  poll_interval = 0
  post_cmd = []
  pre_cmd = []
  rerun = false
  rerun_delay = 500
  send_interrupt = true
  stop_on_error = true

[color]
  app = ""
  build = "yellow"
  main = "magenta"
  runner = "green"
  watcher = "cyan"

[log]
  main_only = false
  silent = false
  time = false

[misc]
  clean_on_exit = true

[proxy]
  app_port = 3000
  app_start_timeout = 5000
  enabled = true
  proxy_port = 7331

[screen]
  clear_on_rebuild = false
  keep_scroll = true
